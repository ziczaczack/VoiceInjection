[package]
name = "voice-dictation"
version = "0.1.0"
description = "Voice dictation desktop app — privacy-first, bilingual (zh/en)"
authors = ["zicza"]
edition = "2021"

[lib]
name = "voice_dictation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls", "stream"] }
log = "0.4"
enigo = "0.2"
arboard = "3"
whisper-rs = { version = "0.16", features = ["cuda"] }
futures-util = "0.3"
fast2s = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
